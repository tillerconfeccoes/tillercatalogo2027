<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>CarnaTiller 2027 · Catálogo de Modelos</title>
  <meta name="description" content="Explore mais de 180 modelos prontos CarnaTiller 2027 e envie sua escolha direto no WhatsApp.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CarnaTiller 2027 · Tiller Confecções">
  <meta property="og:title" content="CarnaTiller 2027 · Catálogo de Modelos">
  <meta property="og:description" content="Explore mais de 180 modelos prontos CarnaTiller 2027 e envie sua escolha direto no WhatsApp.">
  <meta property="og:url" content="https://tillerconfeccoes.github.io/tillercatalogo2027/">
  <meta property="og:image" content="https://tillerconfeccoes.github.io/tillercatalogo2027/imagens/categoria-1/modelo-002.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #39ff14;
      --pink: #ff1493;
      --pink-soft: rgba(255, 20, 147, 0.12);
      --mustard: #d9b65d;
      --ink: #111111;
      --ink-soft: #262626;
      --muted: #6e6e73;
      --canvas: #f4f4f2;
      --surface: #ffffff;
      --line: rgba(17, 17, 17, 0.08);
      --line-strong: rgba(17, 17, 17, 0.15);
      --radius-card: 28px;
      --shadow-rest: 0 6px 20px rgba(17, 17, 17, 0.05);
      --shadow-active: 0 24px 60px rgba(17, 17, 17, 0.13);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.32, 0.64, 1);
      --card-h: clamp(430px, calc(100dvh - 204px), 616px);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      -webkit-text-size-adjust: 100%;
    }

    button, input { font: inherit; color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }

    /* ===== App Viewport Shell ===== */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
    }

    /* ===== Compact Glass Header ===== */
    .topbar {
      flex: 0 0 auto;
      position: relative;
      z-index: 60;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      width: min(640px, 100%);
      margin-inline: auto;
      padding: 10px 14px 0;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 38px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      line-height: 1;
    }

    .brand-mark {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: var(--ink);
      border-radius: 50% 42% 48% 38%;
      transform: rotate(-8deg);
      font-weight: 800;
      font-size: 12.5px;
      letter-spacing: -0.05em;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-text strong {
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .brand-text small {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .topbar-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .position-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 33px;
      padding: 0 11px;
      border-radius: 999px;
      background: rgba(17, 17, 17, 0.055);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .position-pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 2px rgba(57, 255, 20, 0.28);
      transition: background 0.25s ease;
    }

    .icon-btn {
      position: relative;
      height: 33px;
      min-width: 33px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 800;
      transition: transform 0.2s var(--ease-out), background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .icon-btn:hover {
      border-color: var(--line-strong);
      background: #fafafa;
    }

    .icon-btn:active { transform: scale(0.92); }

    .icon-btn.is-active {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }

    .icon-btn.fav-toggle .heart-icon {
      color: var(--pink);
    }

    /* Quick Jump / Favorites Drawer inside Header */
    .header-drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.28s var(--ease-out);
    }

    .header-drawer.open { grid-template-rows: 1fr; }

    .header-drawer-inner {
      overflow: hidden;
    }

    .jump-form {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0 4px;
    }

    .jump-input {
      flex: 1;
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 0 12px;
      background: var(--surface);
      font-size: 13px;
      font-weight: 600;
      outline: none;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .jump-input::-webkit-outer-spin-button,
    .jump-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .jump-input:focus { border-color: var(--ink); }

    .jump-submit {
      height: 38px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      background: var(--ink);
      color: white;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .fav-drawer-list {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      padding: 10px 0 4px;
      scrollbar-width: none;
    }

    .fav-drawer-list::-webkit-scrollbar { display: none; }

    .fav-empty-msg {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      padding: 4px 2px;
    }

    .fav-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 20, 147, 0.25);
      background: var(--pink-soft);
      color: var(--ink);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .fav-pill:hover { background: rgba(255, 20, 147, 0.18); }

    /* Category Tabs */
    .category-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 9px 0 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .category-tabs::-webkit-scrollbar { display: none; }

    .cat-tab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 32px;
      padding: 0 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-soft);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.22s ease, color 0.22s ease, border-color 0.22s ease, transform 0.2s var(--ease-out);
    }

    .cat-tab:active { transform: scale(0.95); }

    .cat-tab.active {
      background: var(--ink);
      color: #ffffff;
      border-color: var(--ink);
    }

    .cat-tab span {
      opacity: 0.62;
      font-size: 10.5px;
      font-weight: 600;
    }

    /* Progress Hairline */
    .loop-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      pointer-events: none;
    }

    .loop-progress-fill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(0.005);
      background: linear-gradient(90deg, var(--green) 0%, var(--pink) 65%, var(--mustard) 100%);
      transition: transform 0.25s var(--ease-out);
    }

    /* ===== Vertical Infinite Reel Stage ===== */
    .reel-shell {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      overflow: hidden;
      padding-bottom: 36px;
    }

    .reel-track {
      position: relative;
      height: 100%;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 40vh 10px;
    }

    .reel-track::-webkit-scrollbar { display: none; }

    /* Desativa animações durante o teleporte silencioso do circuito fechado */
    .reel-track.is-teleporting .model-card,
    .reel-track.is-teleporting .model-media img {
      transition: none !important;
    }

    /* ===== Model Card (Vertical Infinite Carousel Item) ===== */
    .model-card {
      flex: 0 0 auto;
      scroll-snap-align: center;
      width: min(calc(100% - 6px), 420px);
      height: var(--card-h);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: var(--radius-card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-rest);
      overflow: hidden;
      contain: layout style;
      transform: scale(0.92);
      opacity: 0.62;
      filter: saturate(0.9);
      transition:
        transform 0.36s var(--ease-out),
        opacity 0.36s ease,
        filter 0.36s ease,
        box-shadow 0.4s var(--ease-out),
        border-color 0.3s ease;
      will-change: transform, opacity;
    }

    .model-card.is-active {
      transform: scale(1);
      opacity: 1;
      filter: saturate(1);
      box-shadow: var(--shadow-active);
      border-color: rgba(17, 17, 17, 0.12);
    }

    .model-card.is-selected {
      border-color: var(--ink);
      box-shadow: 0 0 0 2.5px var(--green), 0 26px 60px rgba(17, 17, 17, 0.15);
    }

    /* Huge Portrait Media filling the card */
    .model-media {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      background: #ffffff;
      cursor: zoom-in;
      isolation: isolate;
    }

    .model-card.no-image .model-media { cursor: default; }

    .model-media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      z-index: 1;
      transform: scale(1.03);
      transition: transform 0.65s var(--ease-out);
    }

    .model-card.is-active .model-media img {
      transform: scale(1);
    }

    /* Editorial Placeholder */
    .model-placeholder {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
      background:
        radial-gradient(circle at 14% 16%, var(--cat-a, rgba(57, 255, 20, 0.22)) 0%, transparent 44%),
        radial-gradient(circle at 86% 82%, var(--cat-b, rgba(255, 20, 147, 0.16)) 0%, transparent 46%),
        linear-gradient(160deg, #ffffff 0%, #f9f9f7 100%);
    }

    .model-placeholder::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 18px;
      border: 1px dashed rgba(17, 17, 17, 0.1);
      pointer-events: none;
    }

    .ph-crown {
      font-size: 32px;
      color: var(--mustard);
      line-height: 1;
      margin-bottom: 10px;
    }

    .ph-title {
      font-size: clamp(34px, 10vw, 48px);
      font-weight: 800;
      line-height: 0.88;
      letter-spacing: -0.07em;
      transform: rotate(-4deg);
      color: var(--ink);
    }

    .ph-year {
      margin-top: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.04em;
      transform: rotate(-4deg);
    }

    .ph-num {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(17, 17, 17, 0.06);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Overlay Controls on Media */
    .media-top {
      position: absolute;
      top: 13px;
      left: 13px;
      right: 13px;
      z-index: 3;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .model-badge {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(17, 17, 17, 0.07);
      box-shadow: 0 4px 14px rgba(17, 17, 17, 0.08);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .model-badge .cat-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cat-dot, var(--green));
    }

    .model-badge .cat-name {
      font-weight: 600;
      color: var(--muted);
    }

    .media-actions {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .glass-circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(17, 17, 17, 0.08);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 4px 14px rgba(17, 17, 17, 0.08);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--ink);
      transition: transform 0.22s var(--ease-spring), background 0.2s ease, color 0.2s ease;
    }

    .glass-circle-btn:active { transform: scale(0.88); }

    .glass-circle-btn.is-fav {
      background: var(--pink);
      border-color: var(--pink);
      color: white;
    }

    .model-card.no-image .zoom-circle-btn { display: none; }

    .selected-ribbon {
      position: absolute;
      left: 13px;
      bottom: 13px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--green);
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(57, 255, 20, 0.34);
      opacity: 0;
      transform: translateY(8px) scale(0.92);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.32s var(--ease-spring);
    }

    .model-card.is-selected .selected-ribbon {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Card Footer */
    .model-footer {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 15px;
      background: var(--surface);
      border-top: 1px solid var(--line);
    }

    .model-meta { min-width: 0; }

    .model-meta h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.12;
    }

    .model-meta span {
      display: block;
      margin-top: 2px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
    }

    .select-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 42px;
      padding: 0 17px;
      border-radius: 999px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform 0.2s var(--ease-spring), background 0.22s ease, color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .select-btn:hover { background: #222; }
    .select-btn:active { transform: scale(0.94); }

    .model-card.is-selected .select-btn {
      background: var(--green);
      border-color: var(--green);
      color: var(--ink);
      box-shadow: 0 6px 20px rgba(57, 255, 20, 0.28);
    }

    /* Vertical Closed-Loop Nav Buttons (↑ / ↓) */
    .reel-nav {
      position: absolute;
      right: max(12px, calc(50% - 275px));
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reel-nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(17, 17, 17, 0.1);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--ink);
      transition: transform 0.2s var(--ease-spring), background 0.2s ease, border-color 0.2s ease;
    }

    .reel-nav-btn:hover {
      background: #ffffff;
      border-color: var(--line-strong);
      transform: scale(1.06);
    }

    .reel-nav-btn:active { transform: scale(0.92); }

    /* Em telas de celular bem estreitas, deixa os botões discretos ou ocultos para não cobrir a imagem */
    @media (max-width: 560px) {
      .reel-nav { display: none; }
    }

    /* Scroll Hint Pill (desaparece após a 1ª rolagem) */
    .scroll-hint {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 15;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 13px;
      border-radius: 999px;
      background: rgba(17, 17, 17, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.35s ease, transform 0.35s var(--ease-out);
    }

    .scroll-hint.is-hidden {
      opacity: 0;
      transform: translate(-50%, 10px);
    }

    /* ===== Floating Selection Dock (Retoma a conversa no WhatsApp) ===== */
    .selection-dock {
      position: fixed;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 80;
      width: min(432px, calc(100% - 20px));
      transform: translate(-50%, 135%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.42s var(--ease-spring), opacity 0.24s ease;
    }

    .selection-dock.visible {
      transform: translate(-50%, 0);
      opacity: 1;
      pointer-events: auto;
    }

    .dock-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      padding: 8px 9px 8px 10px;
      border-radius: 20px;
      background: rgba(17, 17, 17, 0.94);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      color: #ffffff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .dock-preview {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      cursor: pointer;
    }

    .dock-thumb {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      overflow: hidden;
      background: #222;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .dock-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .dock-thumb-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: var(--green);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .dock-info { min-width: 0; }

    .dock-info small {
      display: block;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.62);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dock-info strong {

  <script>
    // ===== Configuração =====
    const WHATSAPP = "558421338804";
    const PUBLIC_BASE_URL = "https://tillerconfeccoes.github.io/tillercatalogo2027";
    const CLONE_COUNT = 3;

    const CATEGORIES = [
      { id: 1, name: "Ondas & Neon",   start: 1,   end: 40,  folder: "categoria-1", dot: "#39ff14", bgA: "rgba(57,255,20,0.22)",  bgB: "rgba(255,20,147,0.14)" },
      { id: 2, name: "Tropical",       start: 51,  end: 100, folder: "categoria-2", dot: "#ff1493", bgA: "rgba(255,20,147,0.18)", bgB: "rgba(217,182,93,0.20)" },
      { id: 3, name: "Verão & Brasil", start: 101, end: 150, folder: "categoria-3", dot: "#d9b65d", bgA: "rgba(217,182,93,0.24)", bgB: "rgba(57,255,20,0.16)"  },
      { id: 4, name: "Street & Pop",   start: 151, end: 193, folder: "categoria-4", dot: "#111111", bgA: "rgba(17,17,17,0.08)",   bgB: "rgba(217,182,93,0.14)" }
    ];

    const AVAILABLE_MODELS = CATEGORIES.flatMap(c =>
      Array.from({ length: c.end - c.start + 1 }, (_, i) => c.start + i)
    );
    const TOTAL_MODELS = AVAILABLE_MODELS.length;
    const FIRST_MODEL = AVAILABLE_MODELS[0];
    const LAST_MODEL = AVAILABLE_MODELS[TOTAL_MODELS - 1];
    const MODEL_INDEX = new Map(AVAILABLE_MODELS.map((n, i) => [n, i]));

    // ===== DOM =====
    const reel = document.getElementById("reelTrack");
    const categoryTabs = document.getElementById("categoryTabs");
    const tabs = [...categoryTabs.querySelectorAll(".cat-tab")];
    const positionText = document.getElementById("positionText");
    const positionDot = document.getElementById("positionDot");
    const loopProgressFill = document.getElementById("loopProgressFill");
    const scrollHint = document.getElementById("scrollHint");
    const prevBtn = document.getElementById("prevModel");
    const nextBtn = document.getElementById("nextModel");

    const jumpToggle = document.getElementById("jumpToggle");
    const jumpDrawer = document.getElementById("jumpDrawer");
    const jumpForm = document.getElementById("jumpForm");
    const jumpInput = document.getElementById("jumpInput");

    const favToggle = document.getElementById("favToggle");
    const favDrawer = document.getElementById("favDrawer");
    const favDrawerList = document.getElementById("favDrawerList");
    const favCountEl = document.getElementById("favCount");

    const dock = document.getElementById("selectionDock");
    const dockPreview = document.getElementById("dockPreview");
    const dockThumbImg = document.getElementById("dockThumbImg");
    const dockThumbFallback = document.getElementById("dockThumbFallback");
    const dockSub = document.getElementById("dockSub");
    const dockTitle = document.getElementById("dockTitle");
    const dockSharePhotoBtn = document.getElementById("dockSharePhotoBtn");
    const dockSendBtn = document.getElementById("dockSendBtn");
    const dockClearBtn = document.getElementById("dockClearBtn");

    const lightbox = document.getElementById("lightbox");
    const lightboxBackdrop = document.getElementById("lightboxBackdrop");
    const lightboxClose = document.getElementById("lightboxClose");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxTitle = document.getElementById("lightboxTitle");
    const lightboxCategory = document.getElementById("lightboxCategory");
    const lightboxSharePhotoBtn = document.getElementById("lightboxSharePhotoBtn");
    const lightboxSendBtn = document.getElementById("lightboxSendBtn");
    const toast = document.getElementById("toast");

    // ===== Estado =====
    let activeNumber = 1;
    let currentCategory = 1;
    let selectedModel = null;
    let programmaticTarget = null;
    let programmaticTimer = null;
    let scrollSettledTimer = null;
    let isSilentJump = false;
    let scrollTicking = false;
    let hasScrolledOnce = false;
    let lightboxModel = null;
    let lastFocusedBeforeModal = null;
    let modalClearTimer = null;
    let toastTimer = null;

    const favorites = new Set(loadFavorites());
    const missingImages = new Set();
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ===== Utilitários =====
    const pad3 = n => String(n).padStart(3, "0");
    const modelName = n => `Modelo ${pad3(n)}`;
    const categoryOf = n => CATEGORIES.find(c => n >= c.start && n <= c.end);
    function clampModel(n) {
      const target = Math.round(Number(n));
      if (!Number.isFinite(target)) return FIRST_MODEL;
      if (MODEL_INDEX.has(target)) return target;
      let best = FIRST_MODEL, bestDist = Infinity;
      for (const m of AVAILABLE_MODELS) {
        const d = Math.abs(m - target);
        if (d < bestDist) { bestDist = d; best = m; }
      }
      return best;
    }
    const isPublished = () => /^https?:$/.test(location.protocol);
    const getRealCard = n => reel.querySelector(`.model-card[data-number="${n}"]:not([data-clone])`);

    function imagePath(category, n) {
      return `imagens/${category.folder}/modelo-${pad3(n)}.jpg`;
    }

    function modelUrl(n) {
      return `${location.origin}${location.pathname}#modelo-${pad3(n)}`;
    }

    function loadFavorites() {
      try {
        const raw = JSON.parse(localStorage.getItem("ct2027_favs") || "[]");
        return Array.isArray(raw) ? raw.filter(n => Number.isInteger(n) && MODEL_INDEX.has(n)) : [];
      } catch (_) {
        return [];
      }
    }

    function saveFavorites() {
      try {
        localStorage.setItem("ct2027_favs", JSON.stringify([...favorites]));
      } catch (_) {}
      favCountEl.textContent = favorites.size;
      renderFavDrawer();
    }

    function notify(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    function getPublicBase() {
      if (/^https:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/i.test(location.hostname)) {
        const dir = location.pathname.replace(/\/[^/]*$/, "");
        return `${location.origin}${dir}`;
      }
      return PUBLIC_BASE_URL;
    }

    function previewPageUrl(n) {
      return `${getPublicBase()}/m/${pad3(n)}.html`;
    }

    // ===== Retomar conversa no WhatsApp (com prévia visual automática og:image) =====
    function sendChoiceToWhatsApp(n) {
      n = clampModel(n);
      const cat = categoryOf(n);
      const lines = [
        `Oi! Escolhi o *${modelName(n)}* (${cat ? cat.name : ""}) no catálogo CarnaTiller 2027.`,
        previewPageUrl(n),
        "",
        "Podemos seguir com esse modelo!"
      ];

      const waUrl = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(lines.join("\n"))}`;
      const win = window.open(waUrl, "_blank");
      if (win) {
        win.opener = null;
      } else {
        location.href = waUrl;
      }
    }

    // ===== Enviar arquivo real da foto (Web Share API no celular / download no computador) =====
    async function shareModelImage(n, triggerBtn = null) {
      n = clampModel(n);
      if (missingImages.has(n)) {
        notify(`Foto do ${modelName(n)} ainda não disponível.`);
        return;
      }
      const cat = categoryOf(n);
      if (!cat) return;

      if (triggerBtn) triggerBtn.disabled = true;
      try {
        const resp = await fetch(imagePath(cat, n));
        if (!resp.ok) throw new Error("Imagem indisponível");
        const blob = await resp.blob();
        const ext = blob.type === "image/png" ? "png" : "jpg";
        const filename = `CarnaTiller-2027-Modelo-${pad3(n)}.${ext}`;
        const file = new File([blob], filename, { type: blob.type || "image/jpeg" });
        const caption = `Oi! Escolhi o ${modelName(n)} (${cat.name}) no catálogo CarnaTiller 2027.`;

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: `${modelName(n)} · CarnaTiller 2027`,
            text: caption
          });
          return;
        }

        // Fallback para desktop ou navegadores sem compartilhamento de arquivo
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
        notify("Foto baixada! Agora é só anexar no WhatsApp.");
      } catch (err) {
        if (err && err.name === "AbortError") return;
        notify("Não foi possível preparar a foto deste modelo.");
      } finally {
        if (triggerBtn) triggerBtn.disabled = false;
      }
    }

    // ===== Renderização do Circuito Fechado Vertical =====
    function markMissing(n) {
      missingImages.add(n);
      reel.querySelectorAll(`.model-card[data-number="${n}"]`).forEach(card => {
        card.classList.add("no-image");
        const img = card.querySelector("img");
        if (img) img.style.display = "none";
      });
    }

    function createCardElement(cat, n, cloneSide = null) {
      const isFav = favorites.has(n);
      const card = document.createElement("article");
      card.className = "model-card";
      card.dataset.number = n;
      card.dataset.category = cat.id;
      card.style.setProperty("--cat-dot", cat.dot);
      card.style.setProperty("--cat-a", cat.bgA);
      card.style.setProperty("--cat-b", cat.bgB);

      if (cloneSide) {
        card.dataset.clone = cloneSide;
        card.setAttribute("aria-hidden", "true");
      }

      card.innerHTML = `
        <div class="model-media" data-zoom="${n}">
          <div class="model-placeholder" aria-hidden="true">
            <div class="ph-crown">♛</div>
            <div class="ph-title">CARNA<br>TILLER</div>
            <div class="ph-year">2027</div>
            <div class="ph-num">CT · ${pad3(n)} · ${cat.name}</div>
          </div>
          <img src="${imagePath(cat, n)}" alt="${modelName(n)} · Coleção ${cat.name}" loading="lazy" decoding="async">
          <div class="media-top">
            <div class="model-badge">
              <span class="cat-dot"></span>
              <span>CT · ${pad3(n)}</span>
              <span class="cat-name">${cat.name}</span>
            </div>
            <div class="media-actions">
              <button type="button" class="glass-circle-btn fav-btn${isFav ? " is-fav" : ""}" data-fav="${n}" aria-label="${isFav ? "Remover dos salvos" : "Salvar modelo"}" aria-pressed="${isFav}" title="Salvar nos favoritos">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="${isFav ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
              </button>
              <button type="button" class="glass-circle-btn zoom-circle-btn" data-zoom="${n}" aria-label="Ampliar foto do ${modelName(n)}" title="Ampliar em tela cheia">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="15 3 21 3 21 9"></polyline>
                  <polyline points="9 21 3 21 3 15"></polyline>
                  <line x1="21" y1="3" x2="14" y2="10"></line>
                  <line x1="3" y1="21" x2="10" y2="14"></line>
                </svg>
              </button>
            </div>
          </div>
          <div class="selected-ribbon" aria-hidden="true">✓ Escolhido</div>
        </div>

        <div class="model-footer">
          <div class="model-meta">
            <h2>${modelName(n)}</h2>
            <span>Coleção ${cat.name}</span>
          </div>
          <button type="button" class="select-btn" data-select="${n}" aria-pressed="false">Escolher</button>
        </div>
      `;

      const img = card.querySelector("img");
      img.addEventListener("error", () => markMissing(n), { once: true });
      return card;
    }

    function renderInfiniteReel() {
      const frag = document.createDocumentFragment();

      // Clones do fim (191, 192, 193) acima do 001 -> permite rolar para CIMA até o último modelo
      AVAILABLE_MODELS.slice(-CLONE_COUNT).forEach(n => {
        frag.appendChild(createCardElement(categoryOf(n), n, "head"));
      });

      // Modelos reais disponíveis (183 modelos)
      AVAILABLE_MODELS.forEach(n => {
        frag.appendChild(createCardElement(categoryOf(n), n));
      });

      // Clones do início (001, 002, 003) abaixo do último -> permite rolar para BAIXO até o 001
      AVAILABLE_MODELS.slice(0, CLONE_COUNT).forEach(n => {
        frag.appendChild(createCardElement(categoryOf(n), n, "tail"));
      });

      reel.appendChild(frag);
    }

    // ===== Posicionamento & Circuito Fechado =====
    function centerCardVertically(card, smooth = true) {
      if (!card) return;
      const top = card.offsetTop - (reel.clientHeight - card.offsetHeight) / 2;
      reel.scrollTo({
        top: Math.max(0, top),
        behavior: smooth && !prefersReducedMotion ? "smooth" : "auto"
      });
    }

    function updateHeaderIndicators(n) {
      const cat = categoryOf(n);
      const pos = (MODEL_INDEX.get(n) ?? 0) + 1;
      positionText.textContent = `Nº ${pad3(n)}`;
      document.getElementById("positionPill").title = `Modelo ${pad3(n)} (${pos} de ${TOTAL_MODELS})`;
      if (cat) {
        positionDot.style.background = cat.dot;
        updateActiveTab(cat.id);
      }
      loopProgressFill.style.transform = `scaleX(${pos / TOTAL_MODELS})`;
    }

    function updateActiveTab(categoryId) {
      if (currentCategory === categoryId) return;
      currentCategory = categoryId;
      tabs.forEach(tab => {
        const active = Number(tab.dataset.category) === categoryId;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", active ? "true" : "false");
        if (active && categoryTabs.scrollWidth > categoryTabs.clientWidth) {
          const left = tab.offsetLeft - (categoryTabs.clientWidth - tab.offsetWidth) / 2;
          categoryTabs.scrollTo({ left: Math.max(0, left), behavior: prefersReducedMotion ? "auto" : "smooth" });
        }
      });
    }

    function setActiveCard(n, cardEl = null) {
      activeNumber = n;
      reel.querySelectorAll(".model-card.is-active").forEach(c => c.classList.remove("is-active"));
      const card = cardEl || getRealCard(n);
      if (card) card.classList.add("is-active");
      updateHeaderIndicators(n);
    }

    function silentJumpToCard(n) {
      const real = getRealCard(n);
      if (!real) return;
      isSilentJump = true;
      reel.classList.add("is-teleporting");
      reel.style.scrollSnapType = "none";
      centerCardVertically(real, false);
      setActiveCard(n, real);
      requestAnimationFrame(() => {
        reel.style.scrollSnapType = "";
        requestAnimationFrame(() => {
          reel.classList.remove("is-teleporting");
          isSilentJump = false;
        });
      });
    }

    function scrollToCardEl(card, n, smooth = true) {
      if (!card) return;
      setActiveCard(n, card);
      programmaticTarget = n;
      clearTimeout(programmaticTimer);
      programmaticTimer = setTimeout(() => { programmaticTarget = null; }, smooth ? 900 : 60);
      centerCardVertically(card, smooth);
    }

    function goToModel(n, smooth = true) {
      n = clampModel(n);
      scrollToCardEl(getRealCard(n), n, smooth);
    }

    function findCenteredCard() {
      const cards = reel.children;
      if (!cards.length) return null;
      const centerY = reel.scrollTop + reel.clientHeight / 2;
      let closest = cards[0];
      let minDist = Infinity;
      for (const card of cards) {
        const cardCenter = card.offsetTop + card.offsetHeight / 2;
        const d = Math.abs(cardCenter - centerY);
        if (d < minDist) {
          minDist = d;
          closest = card;
        }
      }
      return closest;
    }

    function onReelScrollFrame() {
      scrollTicking = false;
      if (isSilentJump) return;

      const closest = findCenteredCard();
      if (!closest) return;
      const num = Number(closest.dataset.number);

      if (programmaticTarget !== null) {
        if (num === programmaticTarget) programmaticTarget = null;
        return;
      }

      if (num !== activeNumber || !closest.classList.contains("is-active")) {
        setActiveCard(num, closest);
      }
    }

    function checkCloneSnap() {
      if (isSilentJump) return;
      const centered = findCenteredCard();
      if (centered && centered.hasAttribute("data-clone")) {
        silentJumpToCard(Number(centered.dataset.number));
      }
    }

    reel.addEventListener("scroll", () => {
      if (isSilentJump) return;
      if (!hasScrolledOnce) {
        hasScrolledOnce = true;
        scrollHint.classList.add("is-hidden");
      }
      if (!scrollTicking) {
        scrollTicking = true;
        requestAnimationFrame(onReelScrollFrame);
      }
      clearTimeout(scrollSettledTimer);
      scrollSettledTimer = setTimeout(checkCloneSnap, 150);
    }, { passive: true });

    if ("onscrollend" in window) {
      reel.addEventListener("scrollend", () => {
        clearTimeout(scrollSettledTimer);
        checkCloneSnap();
      }, { passive: true });
    }

    // Navegação passo a passo em circuito fechado (↑ e ↓, pulando lacunas)
    function stepPrev() {
      scrollHint.classList.add("is-hidden");
      const idx = MODEL_INDEX.get(activeNumber) ?? 0;
      if (idx <= 0) {
        const cloneLast = reel.querySelector(`.model-card[data-clone="head"][data-number="${LAST_MODEL}"]`);
        scrollToCardEl(cloneLast, LAST_MODEL, true);
      } else {
        goToModel(AVAILABLE_MODELS[idx - 1], true);
      }
    }

    function stepNext() {
      scrollHint.classList.add("is-hidden");
      const idx = MODEL_INDEX.get(activeNumber) ?? 0;
      if (idx >= TOTAL_MODELS - 1) {
        const cloneFirst = reel.querySelector(`.model-card[data-clone="tail"][data-number="${FIRST_MODEL}"]`);
        scrollToCardEl(cloneFirst, FIRST_MODEL, true);
      } else {
        goToModel(AVAILABLE_MODELS[idx + 1], true);
      }
    }

    prevBtn.addEventListener("click", stepPrev);
    nextBtn.addEventListener("click", stepNext);

    // ===== Seleção & Floating Dock =====
    function updateSelectionUI() {
      reel.querySelectorAll(".model-card").forEach(card => {
        const n = Number(card.dataset.number);
        const isSel = selectedModel === n;
        card.classList.toggle("is-selected", isSel);
        const btn = card.querySelector("[data-select]");
        if (btn) {
          btn.textContent = isSel ? "✓ Escolhido" : "Escolher";
          btn.setAttribute("aria-pressed", isSel ? "true" : "false");
        }
      });

      if (selectedModel === null) {
        dock.classList.remove("visible");
        dock.setAttribute("aria-hidden", "true");
        return;
      }

      const cat = categoryOf(selectedModel);
      dockSub.textContent = `Coleção ${cat.name}`;
      dockTitle.textContent = modelName(selectedModel);
      dockThumbFallback.textContent = pad3(selectedModel);

      if (missingImages.has(selectedModel)) {
        dockThumbImg.style.display = "none";
        dockThumbFallback.style.display = "grid";
      } else {
        dockThumbImg.onload = () => {
          dockThumbImg.style.display = "block";
          dockThumbFallback.style.display = "none";
        };
        dockThumbImg.onerror = () => {
          dockThumbImg.style.display = "none";
          dockThumbFallback.style.display = "grid";
        };
        dockThumbImg.alt = modelName(selectedModel);
        dockThumbImg.src = imagePath(cat, selectedModel);
      }

      scrollHint.classList.add("is-hidden");
      dock.classList.add("visible");
      dock.setAttribute("aria-hidden", "false");
    }

    function selectModel(n) {
      n = clampModel(n);
      selectedModel = n;
      updateSelectionUI();
      history.replaceState(null, "", `#modelo-${pad3(n)}`);
    }

    function clearSelection() {
      selectedModel = null;
      updateSelectionUI();
      history.replaceState(null, "", location.pathname);
    }

    // ===== Favoritos =====
    function renderFavDrawer() {
      const list = [...favorites].sort((a, b) => a - b);
      if (!list.length) {
        favDrawerList.innerHTML = `<span class="fav-empty-msg">Toque em ♥ nos modelos para salvar atalhos aqui.</span>`;
        return;
      }
      favDrawerList.innerHTML = list.map(n => {
        const cat = categoryOf(n);
        return `<button type="button" class="fav-pill" data-jump-fav="${n}">♥ ${pad3(n)} · ${cat.name}</button>`;
      }).join("");
    }

    function toggleFavorite(n) {
      if (favorites.has(n)) {
        favorites.delete(n);
        notify(`${modelName(n)} removido dos salvos.`);
      } else {
        favorites.add(n);
        notify(`${modelName(n)} salvo nos favoritos.`);
      }
      saveFavorites();

      const isFav = favorites.has(n);
      reel.querySelectorAll(`[data-fav="${n}"]`).forEach(btn => {
        btn.classList.toggle("is-fav", isFav);
        btn.setAttribute("aria-pressed", isFav ? "true" : "false");
        btn.setAttribute("aria-label", isFav ? "Remover dos salvos" : "Salvar modelo");
        const svg = btn.querySelector("svg");
        if (svg) svg.setAttribute("fill", isFav ? "currentColor" : "none");
      });
    }

    // ===== Drawers do Topo =====
    function closeDrawers() {
      jumpDrawer.classList.remove("open");
      jumpToggle.classList.remove("is-active");
      jumpToggle.setAttribute("aria-expanded", "false");
      favDrawer.classList.remove("open");
      favToggle.classList.remove("is-active");
      favToggle.setAttribute("aria-expanded", "false");
    }

    jumpToggle.addEventListener("click", () => {
      const willOpen = !jumpDrawer.classList.contains("open");
      closeDrawers();
      if (willOpen) {
        jumpDrawer.classList.add("open");
        jumpToggle.classList.add("is-active");
        jumpToggle.setAttribute("aria-expanded", "true");
        setTimeout(() => jumpInput.focus(), 120);
      }
    });

    favToggle.addEventListener("click", () => {
      const willOpen = !favDrawer.classList.contains("open");
      closeDrawers();
      if (willOpen) {
        favDrawer.classList.add("open");
        favToggle.classList.add("is-active");
        favToggle.setAttribute("aria-expanded", "true");
      }
    });

    jumpForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const val = Math.round(Number(jumpInput.value));
      if (!Number.isFinite(val) || !MODEL_INDEX.has(val)) {
        notify("Modelo indisponível. Números: 1–40 e 51–193.");
        jumpInput.focus();
        return;
      }
      closeDrawers();
      jumpInput.blur();
      goToModel(val, true);
    });

    favDrawerList.addEventListener("click", (e) => {
      const pill = e.target.closest("[data-jump-fav]");
      if (!pill) return;
      const num = Number(pill.dataset.jumpFav);
      closeDrawers();
      goToModel(num, true);
    });

    // ===== Lightbox =====
    function openLightbox(n) {
      if (missingImages.has(n)) {
        notify(`Foto do ${modelName(n)} ainda não disponível.`);
        return;
      }
      const cat = categoryOf(n);
      if (!cat) return;

      clearTimeout(modalClearTimer);
      lightboxModel = n;
      lightboxImg.src = imagePath(cat, n);
      lightboxImg.alt = `${modelName(n)} · ${cat.name}`;
      lightboxTitle.textContent = modelName(n);
      lightboxCategory.textContent = `Coleção ${cat.name}`;

      lastFocusedBeforeModal = document.activeElement;
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      lightboxClose.focus({ preventScroll: true });
    }

    function closeLightbox() {
      if (!lightbox.classList.contains("open")) return;
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      modalClearTimer = setTimeout(() => lightboxImg.removeAttribute("src"), 260);
      if (lastFocusedBeforeModal && typeof lastFocusedBeforeModal.focus === "function") {
        lastFocusedBeforeModal.focus({ preventScroll: true });
      }
    }

    lightboxImg.addEventListener("error", () => {
      if (!lightbox.classList.contains("open") || !lightboxImg.getAttribute("src")) return;
      if (lightboxModel) markMissing(lightboxModel);
      closeLightbox();
      notify("Foto ainda não disponível para este modelo.");
    });

    lightboxClose.addEventListener("click", closeLightbox);
    lightboxBackdrop.addEventListener("click", closeLightbox);

    lightboxSharePhotoBtn.addEventListener("click", () => {
      if (lightboxModel) shareModelImage(lightboxModel, lightboxSharePhotoBtn);
    });

    lightboxSendBtn.addEventListener("click", () => {
      if (!lightboxModel) return;
      const num = lightboxModel;
      selectModel(num);
      closeLightbox();
      sendChoiceToWhatsApp(num);
    });

    // ===== Delegação de Eventos =====
    reel.addEventListener("click", (e) => {
      const favBtn = e.target.closest("[data-fav]");
      if (favBtn) {
        e.stopPropagation();
        toggleFavorite(Number(favBtn.dataset.fav));
        return;
      }

      const selectBtn = e.target.closest("[data-select]");
      if (selectBtn) {
        const num = Number(selectBtn.dataset.select);
        if (selectedModel === num) {
          sendChoiceToWhatsApp(num);
        } else {
          selectModel(num);
          notify(`${modelName(num)} selecionado!`);
        }
        return;
      }

      const zoomEl = e.target.closest("[data-zoom]");
      if (zoomEl) {
        openLightbox(Number(zoomEl.dataset.zoom));
      }
    });

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        const cat = CATEGORIES.find(c => c.id === Number(tab.dataset.category));
        if (cat) {
          closeDrawers();
          goToModel(cat.start, true);
        }
      });
    });

    document.getElementById("brandHome").addEventListener("click", (e) => {
      e.preventDefault();
      closeDrawers();
      goToModel(1, true);
    });

    dockSharePhotoBtn.addEventListener("click", () => {
      if (selectedModel !== null) shareModelImage(selectedModel, dockSharePhotoBtn);
    });

    dockSendBtn.addEventListener("click", () => {
      if (selectedModel !== null) sendChoiceToWhatsApp(selectedModel);
    });

    dockClearBtn.addEventListener("click", clearSelection);

    dockPreview.addEventListener("click", () => {
      if (selectedModel !== null) goToModel(selectedModel, true);
    });

    // Teclado (↑ / ↓ para navegar, Esc para fechar lightbox)
    document.addEventListener("keydown", (e) => {
      if (lightbox.classList.contains("open")) {
        if (e.key === "Escape") {
          closeLightbox();
        } else if (e.key === "Tab") {
          const focusables = [lightboxClose, lightboxSharePhotoBtn, lightboxSendBtn];
          const idx = focusables.indexOf(document.activeElement);
          e.preventDefault();
          focusables[(idx + (e.shiftKey ? -1 : 1) + focusables.length) % focusables.length].focus();
        }
        return;
      }

      if (document.activeElement && document.activeElement.tagName === "INPUT") return;
      if (e.key === "ArrowUp") {
        e.preventDefault();
        stepPrev();
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        stepNext();
      }
    });

    // Recentraliza ao redimensionar ou girar o celular
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => silentJumpToCard(activeNumber), 140);
    });

    // ===== Inicialização =====
    function init() {
      renderInfiniteReel();
      saveFavorites();

      const match = location.hash.match(/^#modelo-(\d{1,3})$/);
      if (match) {
        const n = clampModel(Number(match[1]));
        selectModel(n);
        requestAnimationFrame(() => silentJumpToCard(n));
      } else {
        requestAnimationFrame(() => silentJumpToCard(1));
      }
    }

    init();
  </script>
</body>
</html>
